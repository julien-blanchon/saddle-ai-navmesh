[workspace]
members = [
    "common",
    "basic",
    "dynamic_obstacles",
    "multi_agent_classes",
    "offmesh_links",
    "procedural_rebake",
    "steering_integration",
    "stress",
    "lab",
]
resolver = "3"

[workspace.dependencies]
bevy = { version = "0.18", features = ["serialize"] }
bevy_flair = "0.7"
bevy_input_focus = "0.18"
bevy_ui_widgets = "0.18"
saddle-pane = { git = "https://github.com/julien-blanchon/saddle-pane" }
saddle-ai-steering = { git = "https://github.com/julien-blanchon/saddle-ai-steering" }
saddle-ai-navmesh = { path = ".." }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
collapsible_if = "allow"
