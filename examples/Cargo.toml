[workspace]
members = [
    "common",
    "basic",
    "dynamic_obstacles",
    "multi_agent_classes",
    "offmesh_links",
    "procedural_rebake",
    "stress",
    "lab",
]
resolver = "3"

[workspace.dependencies]
bevy = { version = "0.18", features = ["serialize"] }
saddle-ai-navmesh = { path = ".." }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
